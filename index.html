<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4d36" />
  <meta name="author" content="Andrei Ando" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PlantPal" />
  <title>PlantPal 🌿</title>
  <link rel="manifest" href="/manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f6f3ec; --card: #fffdf9; --ink: #1b2a21; --muted: #6d7a71; --line: #e8e3d6;
      --forest: #1f4d36; --leaf: #3f8f5f; --mint: #e3efe5; --sun: #f6e7bd; --sun-ink: #7a5412; --clay: #f6dcd2; --clay-ink: #9a3a1c;
      --green-50: #f1f6f1; --green-100: #e3efe5; --green-200: #c9dfcd; --green-500: #3f8f5f; --green-600: #2f7a4d; --green-700: #1f4d36; --green-900: #1b2a21;
      --amber-100: #f6e7bd; --amber-800: #7a5412; --red-100: #f6dcd2; --red-700: #9a3a1c;
      --gray-50: #faf8f3; --gray-100: #eeeadf; --gray-200: #e0dbcc; --gray-400: #98a29b; --gray-500: #6d7a71; --gray-700: #3c4a41; --gray-900: #1b2a21;
      --serif: 'Fraunces', Georgia, serif; --r: 20px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    .app { min-height: 100vh; max-width: 480px; margin: 0 auto; background: var(--bg); position: relative; }
    .view { animation: fadeUp .28s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .tab-content { padding: calc(env(safe-area-inset-top, 0px) + 26px) 18px 130px; }
    .tab-title { font-family: var(--serif); font-size: 28px; font-weight: 600; color: var(--forest); margin-bottom: 4px; letter-spacing: -0.5px; }
    .tab-sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
    .section-h { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 10px; }
    .section-h h3 { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--forest); }
    .link-btn { border: none; background: none; font: inherit; font-size: 13px; font-weight: 700; color: var(--leaf); cursor: pointer; padding: 6px 0; }
    /* bottom nav */
    .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: flex; align-items: flex-end; background: rgba(255,253,249,.94); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 8px 6px calc(env(safe-area-inset-bottom, 0px) + 8px); z-index: 30; }
    .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; border: none; background: none; font-family: inherit; color: var(--gray-400); cursor: pointer; padding: 6px 0; min-height: 48px; transition: color .15s; }
    .tab-btn .ico { font-size: 21px; filter: grayscale(1) opacity(.6); transition: filter .15s, transform .15s; }
    .tab-btn .lbl { font-size: 11px; font-weight: 700; }
    .tab-btn.active { color: var(--forest); }
    .tab-btn.active .ico { filter: none; transform: translateY(-1px); }
    .tab-scan .fab { width: 58px; height: 58px; border-radius: 50%; margin-top: -26px; background: linear-gradient(145deg, var(--leaf), var(--forest)); display: flex; align-items: center; justify-content: center; font-size: 25px; box-shadow: 0 8px 22px rgba(31,77,54,.35); border: 4px solid var(--bg); transition: transform .15s; }
    .tab-scan:active .fab { transform: scale(.94); }
    .tab-scan .lbl { color: var(--forest); }
    /* home */
    .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .brand-name { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--forest); }
    .greeting { font-family: var(--serif); font-size: 32px; font-weight: 600; color: var(--forest); line-height: 1.1; letter-spacing: -.8px; margin: 4px 0 6px; }
    .hero { background: linear-gradient(150deg, #2f7a4d 0%, #1f4d36 100%); color: #fff; border-radius: 26px; padding: 22px 20px; margin: 20px 0 4px; position: relative; overflow: hidden; }
    .hero::after { content: "🌿"; position: absolute; right: -10px; bottom: -22px; font-size: 120px; opacity: .14; transform: rotate(-12deg); }
    .hero h2 { font-family: var(--serif); font-size: 23px; font-weight: 600; margin-bottom: 6px; }
    .hero p { font-size: 14px; opacity: .85; line-height: 1.45; margin-bottom: 16px; max-width: 260px; }
    .hero-btn { background: #fff; color: var(--forest); border: none; border-radius: 14px; padding: 13px 20px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; min-height: 48px; position: relative; z-index: 1; }
    .hero-btn:active { transform: scale(.97); }
    .stats { display: flex; gap: 10px; margin-top: 12px; }
    .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
    .stat b { display: block; font-family: var(--serif); font-size: 26px; color: var(--forest); font-weight: 600; }
    .stat span { font-size: 12px; color: var(--muted); font-weight: 600; }
    .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quick-btn { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 64px; }
    .quick-btn b { font-size: 14px; color: var(--ink); } .quick-btn span { font-size: 12px; color: var(--muted); }
    /* plant rows & cards */
    .thumb { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; background: var(--mint); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .plant-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .plant-card { background: var(--card); border-radius: 18px; padding: 12px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); }
    .plant-card.urgent { border-color: #ecd48f; background: #fffaf0; }
    .plant-info { flex: 1; min-width: 0; }
    .plant-name { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plant-meta { font-size: 12px; color: var(--muted); }
    .status-badge, .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; display: inline-block; }
    .status-ok, .badge-high { background: var(--mint); color: var(--forest); }
    .status-today, .badge-medium { background: var(--sun); color: var(--sun-ink); }
    .status-urgent, .badge-low { background: var(--clay); color: var(--clay-ink); }
    .plant-actions { display: flex; gap: 6px; }
    .action-btn { width: 44px; height: 44px; border: none; border-radius: 13px; cursor: pointer; font-size: 17px; display: flex; align-items: center; justify-content: center; transition: transform .12s; font-family: inherit; font-weight: 700; }
    .action-btn:active { transform: scale(.92); }
    .action-water { background: #dcecf7; color: #0b5a8a; } .action-cal { background: var(--mint); color: var(--forest); } .action-remove { background: var(--clay); color: var(--clay-ink); font-size: 13px; }
    .db-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .db-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid var(--line); cursor: pointer; text-align: left; padding: 0; font: inherit; transition: transform .15s; }
    .db-card:active { transform: scale(.97); }
    .db-card-img, .db-card-img-placeholder { width: 100%; aspect-ratio: 1; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 40px; background: var(--mint); }
    .db-card-body { padding: 10px 12px 12px; }
    .db-card-name { font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .db-card-sci { font-size: 12px; color: var(--muted); font-style: italic; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* sheet */
    .scrim { position: fixed; inset: 0; background: rgba(20,32,25,.45); z-index: 40; animation: fade .2s ease both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 28px 28px 0 0; z-index: 41; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); animation: sheetUp .3s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes sheetUp { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }
    .sheet-img { width: 100%; height: 220px; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 64px; background: var(--mint); border-radius: 28px 28px 0 0; }
    .sheet-body { padding: 18px 18px 0; }
    .sheet-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,253,249,.92); font-size: 16px; cursor: pointer; z-index: 2; }
    .sheet-actions { display: flex; gap: 8px; margin: 14px 0; }
    /* forms and buttons */
    .dropzone { border: 2px dashed var(--green-200); border-radius: 22px; min-height: 220px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--card); margin-bottom: 12px; transition: border-color .2s, background .2s; }
    .dropzone:active { background: var(--mint); border-color: var(--leaf); }
    .drop-placeholder { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px; text-align: center; }
    .drop-icon { font-size: 46px; } .drop-text { font-size: 14px; color: var(--muted); font-weight: 500; }
    .hidden { display: none; }
    .btn { width: 100%; min-height: 50px; padding: 13px 0; border: none; border-radius: 15px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 8px; transition: transform .12s, opacity .15s; }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: linear-gradient(145deg, var(--leaf), var(--forest)); color: #fff; box-shadow: 0 6px 18px rgba(31,77,54,.22); }
    .btn-primary:disabled { opacity: .6; cursor: default; box-shadow: none; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--line); }
    .input { width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 13px; font-family: inherit; font-size: 15px; color: var(--ink); background: var(--gray-50); outline: none; transition: border-color .15s; }
    .input:focus { border-color: var(--leaf); background: #fff; }
    .input-small { width: 76px; text-align: center; }
    .add-card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 20px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
    .freq-row { display: flex; align-items: center; gap: 8px; } .freq-label { font-size: 14px; color: var(--muted); white-space: nowrap; }
    .result-card, .advice-card { background: var(--card); border-radius: 22px; padding: 18px 16px; margin-top: 16px; border: 1px solid var(--line); animation: fadeUp .3s ease both; }
    .result-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 8px; }
    .common-name { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--forest); }
    .sci-name { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 2px; }
    .result-desc { font-size: 14px; color: var(--gray-700); line-height: 1.6; margin-bottom: 12px; }
    .tip-box { display: flex; gap: 8px; background: var(--mint); border-radius: 12px; padding: 11px 12px; font-size: 13px; color: var(--forest); align-items: flex-start; margin-bottom: 10px; line-height: 1.5; }
    .water-suggest { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--gray-700); padding: 10px 0 0; border-top: 1px solid var(--line); }
    .health-issues { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .health-issue { display: flex; gap: 8px; background: #fff4e5; border: 1px solid #f1d4a6; border-radius: 12px; padding: 10px 12px; font-size: 13px; }
    .health-issue-title { font-weight: 700; color: #8a4b0e; margin-bottom: 2px; } .health-issue-advice { color: #6b4115; line-height: 1.5; }
    .symptom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .symptom-btn { min-height: 48px; padding: 12px 8px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--gray-700); transition: all .15s; }
    .symptom-btn.active { border-color: var(--leaf); background: var(--mint); color: var(--forest); }
    .advice-label { font-size: 11px; font-weight: 700; color: var(--leaf); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
    .advice-text { font-size: 14px; color: var(--gray-700); line-height: 1.65; }
    .advice-divider { height: 1px; background: var(--line); margin: 14px 0; }
    .cal-hint { display: flex; gap: 10px; background: var(--mint); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--forest); line-height: 1.5; }
    /* feedback: empty, error, skeleton, toast */
    .empty-state { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 34px 24px; text-align: center; background: var(--card); border: 1.5px dashed var(--line); border-radius: 22px; }
    .empty-state h4 { font-family: var(--serif); font-size: 19px; color: var(--forest); font-weight: 600; }
    .empty-text { font-size: 14px; color: var(--muted); line-height: 1.5; max-width: 260px; }
    .empty-state .btn { width: auto; padding: 0 24px; margin: 6px 0 0; }
    .error-card { background: var(--clay); color: var(--clay-ink); border-radius: 16px; padding: 14px 16px; font-size: 14px; margin-top: 12px; line-height: 1.5; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .error-card button { background: #fff; color: var(--clay-ink); border: none; border-radius: 10px; padding: 9px 16px; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; min-height: 40px; }
    .skel { background: linear-gradient(90deg, #ece8dc 25%, #f6f3ec 50%, #ece8dc 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite linear; border-radius: 10px; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .skel-label { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 14px; }
    .toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); width: calc(100% - 32px); max-width: 440px; z-index: 60; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { background: var(--forest); color: #fff; border-radius: 14px; padding: 13px 16px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 10px 28px rgba(0,0,0,.22); animation: toastIn .25s ease both; pointer-events: auto; }
    .toast button { background: none; border: none; color: #bfe6c9; font: inherit; font-weight: 700; cursor: pointer; min-height: 32px; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .spinner { width: 20px; height: 20px; border: 2.5px solid var(--green-100); border-top-color: var(--leaf); border-radius: 50%; animation: spin .75s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .preview-img { width: 100%; max-height: 320px; object-fit: cover; display: block; }
    .zoom-box { position: relative; width: 100%; overflow: hidden; border-radius: 22px; border: 2px solid var(--leaf); background: #111; touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
    .zoom-controls { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .zoom-controls input[type=range] { flex: 1; min-width: 0; accent-color: var(--leaf); }
    .zoom-btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; min-width: 44px; height: 44px; font-size: 20px; line-height: 1; cursor: pointer; padding: 0 10px; color: inherit; }
    .zoom-btn.zoom-reset { font-size: 13px; }
    button:focus-visible, .input:focus-visible { outline: 3px solid rgba(63,143,95,.45); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/plain" id="app-source">

const { useState, useEffect, useRef } = React;

function useLocalStorage(key, initial) {
  const [val, setVal] = useState(() => {
    try { return JSON.parse(localStorage.getItem(key)) ?? initial; }
    catch { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }, [key, val]);
  return [val, setVal];
}

function today() { return new Date().toISOString().split("T")[0]; }
function addDays(dateStr, n) { const d = new Date(dateStr); d.setDate(d.getDate() + n); return d; }
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

function generateICS(plant) {
  const start = addDays(plant.lastWatered, plant.freq);
  const dtstart = start.toISOString().split("T")[0].replace(/-/g, "");
  const uid = `plantpal-${plant.id}@plantpal.app`;
  const now = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//PlantPal//EN","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",`UID:${uid}`,`DTSTAMP:${now}`,
    `DTSTART;VALUE=DATE:${dtstart}`,`DTEND;VALUE=DATE:${dtstart}`,
    `SUMMARY:💧 Water ${plant.name}`,
    `DESCRIPTION:Water your ${plant.name} — every ${plant.freq} days.`,
    `RRULE:FREQ=DAILY;INTERVAL=${plant.freq}`,
    "BEGIN:VALARM","TRIGGER:-PT0M","ACTION:DISPLAY",
    `DESCRIPTION:Water ${plant.name} today!`,"END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
}

function downloadICS(plant) {
  const blob = new Blob([generateICS(plant)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `water-${plant.name.replace(/\s+/g, "-").toLowerCase()}.ics`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// POST JSON to our own API. Retries once on a network-level failure, because Safari
// sometimes reports "Load failed" when it reuses a stale connection.
async function postJSON(url, body) {
  const send = () => fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  let res;
  try { res = await send(); }
  catch (e) {
    await new Promise(r => setTimeout(r, 600));
    try { res = await send(); }
    catch (e2) { throw new Error("Could not reach the server. Check your connection and try again."); }
  }
  if (!res.ok) {
    let detail = "";
    try { const j = await res.json(); detail = j.detail || j.error || ""; } catch {}
    throw new Error(`Server error ${res.status}${detail ? ": " + detail : ""}`);
  }
  return await res.json();
}

async function identifyPlant(base64, mimeType) {
  return postJSON("/api/identify", { image: base64, mimeType });
}

async function diagnosePlant(base64, mimeType) {
  return postJSON("/api/diagnose", { image: base64, mimeType });
}

const SYMPTOMS = [
  { id: "yellow", label: "🟡 Yellow Leaves", cause: "Overwatering or nutrient deficiency", action: "Reduce watering and check drainage. Let soil dry between waterings." },
  { id: "brown", label: "🟤 Brown Tips", cause: "Low humidity or underwatering", action: "Mist leaves regularly and water more consistently." },
  { id: "wilting", label: "🥀 Wilting", cause: "Water stress (over or under)", action: "Check soil moisture immediately — water if dry, let dry out if soggy." },
  { id: "spots", label: "🔵 Dark Spots", cause: "Fungal infection or cold damage", action: "Remove affected leaves and improve air circulation." },
  { id: "leggy", label: "🌿 Leggy Growth", cause: "Insufficient light", action: "Move closer to a bright window or add a grow light." },
  { id: "pale", label: "🪶 Pale Colour", cause: "Too much direct sun or iron deficiency", action: "Move to indirect light and consider a liquid fertiliser." },
];

function loadSourceImage(file) {
  return new Promise((resolve) => {
    if (!file || !file.type.startsWith("image/")) return resolve(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1600;
        const k = Math.min(1, MAX / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.9));
      };
      img.onerror = () => resolve(null);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

// Pinch / drag / slider zoom. cropRef.current() returns the visible area as a JPEG data URL.
function ZoomCrop({ src, cropRef }) {
  const MAXZ = 6;
  const boxRef = useRef();
  const imgObj = useRef(null);
  const pointers = useRef(new Map());
  const gesture = useRef(null);
  const [nat, setNat] = useState(null);
  const [bw, setBw] = useState(320);
  const [t, setT] = useState({ zoom: 1, x: 0, y: 0 });

  const bh = nat ? Math.round(bw * Math.min(1.3, Math.max(0.6, nat.h / nat.w))) : bw;
  const base = nat ? Math.max(bw / nat.w, bh / nat.h) : 1;
  const geo = useRef({});
  const tRef = useRef(t);
  geo.current = { nat, bw, bh, base };
  tRef.current = t;

  const clampT = (zoom, x, y) => {
    const g = geo.current;
    const z = Math.min(MAXZ, Math.max(1, zoom));
    const sc = g.base * z;
    return {
      zoom: z,
      x: Math.min(0, Math.max(g.bw - g.nat.w * sc, x)),
      y: Math.min(0, Math.max(g.bh - g.nat.h * sc, y))
    };
  };
  const zoomAt = (newZoom, fx, fy) => {
    if (!geo.current.nat) return;
    const from = tRef.current;
    const b = geo.current.base;
    const z = Math.min(MAXZ, Math.max(1, newZoom));
    const ix = (fx - from.x) / (b * from.zoom);
    const iy = (fy - from.y) / (b * from.zoom);
    setT(clampT(z, fx - ix * b * z, fy - iy * b * z));
  };
  const reset = () => {
    if (!nat) return;
    setT(clampT(1, (bw - nat.w * base) / 2, (bh - nat.h * base) / 2));
  };

  useEffect(() => {
    setNat(null);
    const im = new Image();
    im.onload = () => { imgObj.current = im; setNat({ w: im.naturalWidth, h: im.naturalHeight }); };
    im.src = src;
  }, [src]);

  useEffect(() => { if (nat) reset(); }, [nat]);
  useEffect(() => { if (nat) setT(p => clampT(p.zoom, p.x, p.y)); }, [bw]);

  useEffect(() => {
    const el = boxRef.current;
    if (!el) return;
    const measure = () => setBw(Math.max(100, Math.round(el.clientWidth)));
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    const onWheel = (e) => {
      e.preventDefault();
      const r = el.getBoundingClientRect();
      zoomAt(tRef.current.zoom * Math.exp(-e.deltaY * 0.002), e.clientX - r.left, e.clientY - r.top);
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => { ro.disconnect(); el.removeEventListener("wheel", onWheel); };
  }, []);

  cropRef.current = () => {
    const g = geo.current, tt = tRef.current, im = imgObj.current;
    if (!g.nat || !im) return src;
    const sc = g.base * tt.zoom;
    const sx = -tt.x / sc, sy = -tt.y / sc, sw = g.bw / sc, sh = g.bh / sc;
    const k = Math.min(1, 1024 / Math.max(sw, sh));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(sw * k));
    c.height = Math.max(1, Math.round(sh * k));
    c.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.85);
  };

  const local = (e) => {
    const r = boxRef.current.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  const snapshot = () => {
    const pts = [...pointers.current.values()];
    if (pts.length === 1) gesture.current = { type: "pan", p0: pts[0], t0: tRef.current };
    else if (pts.length >= 2) {
      const [a, b] = pts;
      gesture.current = {
        type: "pinch",
        d0: Math.hypot(a.x - b.x, a.y - b.y) || 1,
        m0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
        t0: tRef.current
      };
    } else gesture.current = null;
  };
  const onDown = (e) => {
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
    pointers.current.set(e.pointerId, local(e));
    snapshot();
  };
  const onMove = (e) => {
    if (!pointers.current.has(e.pointerId)) return;
    pointers.current.set(e.pointerId, local(e));
    const g = gesture.current;
    if (!g || !geo.current.nat) return;
    const pts = [...pointers.current.values()];
    if (g.type === "pan" && pts.length === 1) {
      setT(clampT(g.t0.zoom, g.t0.x + pts[0].x - g.p0.x, g.t0.y + pts[0].y - g.p0.y));
    } else if (g.type === "pinch" && pts.length >= 2) {
      const [a, b] = pts;
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const z = Math.min(MAXZ, Math.max(1, g.t0.zoom * d / g.d0));
      const bs = geo.current.base;
      const ix = (g.m0.x - g.t0.x) / (bs * g.t0.zoom);
      const iy = (g.m0.y - g.t0.y) / (bs * g.t0.zoom);
      setT(clampT(z, m.x - ix * bs * z, m.y - iy * bs * z));
    }
  };
  const onUp = (e) => { pointers.current.delete(e.pointerId); snapshot(); };

  return (
    <div style={{ marginBottom: 12 }}>
      <div ref={boxRef} className="zoom-box" style={{ height: bh }}
        onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}>
        {nat && (
          <img src={src} alt="plant" draggable={false}
            style={{ position: "absolute", left: 0, top: 0, maxWidth: "none", pointerEvents: "none",
              width: nat.w * base * t.zoom, height: nat.h * base * t.zoom,
              transform: `translate(${t.x}px, ${t.y}px)` }} />
        )}
      </div>
      <div className="zoom-controls">
        <button className="zoom-btn" onClick={() => zoomAt(t.zoom / 1.25, bw / 2, bh / 2)} aria-label="Zoom out">−</button>
        <input type="range" min="1" max={MAXZ} step="0.01" value={t.zoom}
          onChange={e => zoomAt(parseFloat(e.target.value), bw / 2, bh / 2)} aria-label="Zoom" />
        <button className="zoom-btn" onClick={() => zoomAt(t.zoom * 1.25, bw / 2, bh / 2)} aria-label="Zoom in">+</button>
        <button className="zoom-btn zoom-reset" onClick={reset}>Reset</button>
      </div>
      <div className="sci-name" style={{ fontSize: 12, margin: "6px 0 0" }}>Pinch or use the slider to zoom, drag to move. Only the visible area is sent.</div>
    </div>
  );
}

function IdentifyTab({ onAddPlant }) {
  const [image, setImage] = useState(null);

  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [added, setAdded] = useState(false);
  const [saved, setSaved] = useState(false);
  const [source, setSource] = useState(null);
  const cropRef = useRef(null);
  const fileRef = useRef();

  const handleFile = async (file) => {
    const src = await loadSourceImage(file);
    if (!src) return;
    setSource(src); setPreview(null); setImage(null);
    setResult(null); setError(null); setAdded(false); setSaved(false);
  };

  const identify = async () => {
    setLoading(true); setError(null);
    try {
      const cropped = cropRef.current();
      setPreview(cropped);
      const data = await identifyPlant(cropped.split(",")[1], "image/jpeg");

        setError("We could not identify this plant. Try a clearer, closer photo of the leaves.");

        setError("Something went wrong on our side. Please try again.");
      } else {
        setResult(data);
      }

  };

      common_name: result.common_name,

      confidence: result.confidence,

    };

function RemindersTab({ pending, onPendingClear, go }) {
  const [plants, setPlants] = useLocalStorage("plantpal_v2", []);
  const [name, setName] = useState("");
  const [freq, setFreq] = useState(7);
  const [exported, setExported] = useState({});

  useEffect(() => {
    if (pending) { setName(pending.name); setFreq(pending.freq); onPendingClear(); }
  }, [pending]);

  const add = () => {
    if (!name.trim()) return;
    setPlants([...plants, { id: Date.now(), name: name.trim(), freq: Number(freq), lastWatered: today() }]);
    setName(""); setFreq(7);
    window.toast(`🌱 Added ${name.trim()}`);
  };

  const waterNow = id => { const p = plants.find(x => x.id === id); setPlants(plants.map(x => x.id === id ? { ...x, lastWatered: today() } : x)); window.toast(`💧 Watered ${p.name}`); };
  const remove = id => { const p = plants.find(x => x.id === id); setPlants(plants.filter(x => x.id !== id)); window.toast(`Removed ${p.name}`, { label: "Undo", fn: () => setPlants(cur => [...cur, p]) }); };

  const handleExport = (plant) => {
    downloadICS(plant);
    setExported(e => ({ ...e, [plant.id]: true }));
    setTimeout(() => setExported(e => ({ ...e, [plant.id]: false })), 3000);
  };

  const getStatus = (plant) => {
    const next = addDays(plant.lastWatered, plant.freq);
    const diff = daysBetween(today(), next.toISOString().split("T")[0]);
    if (diff < 0) return { label: `${Math.abs(diff)}d overdue`, cls: "status-urgent", urgent: true };
    if (diff === 0) return { label: "Water today!", cls: "status-today", urgent: true };
    return { label: `In ${diff} day${diff !== 1 ? "s" : ""}`, cls: "status-ok", urgent: false };
  };

  return (
    <div className="tab-content">
      <h2 className="tab-title">Watering</h2>
      <p className="tab-sub">Add plants and export recurring reminders to your calendar.</p>
      <div className="add-card">
        <input className="input" placeholder="Plant name (e.g. Peace Lily)"
          value={name} onChange={e => setName(e.target.value)} onKeyDown={e => e.key === "Enter" && add()} />
        <div className="freq-row">
          <label className="freq-label">Water every</label>
          <input type="number" min="1" max="90" className="input input-small" value={freq} onChange={e => setFreq(e.target.value)} />
          <span className="freq-label">days</span>
        </div>
        <button className="btn btn-primary" onClick={add}>Add Plant</button>
      </div>
      {plants.length === 0 && <div className="empty-state"><div style={{fontSize:44}}>💧</div><h4>No reminders yet</h4><div className="empty-text">Add a plant above, or scan one to get a suggested schedule.</div><button className="btn btn-ghost" onClick={() => go("identify")}>Scan a plant</button></div>}
      <div className="plant-list">
        {plants.map(plant => {
          const s = getStatus(plant);
          return (
            <div key={plant.id} className={`plant-card ${s.urgent ? "urgent" : ""}`}>
              <div className="plant-info">
                <div className="plant-name">{plant.name}</div>
                <div className="plant-meta">Every {plant.freq} days · Last watered {plant.lastWatered}</div>
              </div>
              <div className={`status-badge ${s.cls}`}>{s.label}</div>
              <div className="plant-actions">
                <button className="action-btn action-water" onClick={() => waterNow(plant.id)} title="Mark watered" aria-label="Mark watered">💧</button>
                <button className="action-btn action-cal" onClick={() => handleExport(plant)} title="Add to Calendar">{exported[plant.id] ? "✓" : "📅"}</button>
                <button className="action-btn action-remove" onClick={() => remove(plant.id)} title="Remove">✕</button>
              </div>
            </div>
          );
        })}
      </div>
      {plants.length > 0 && (
        <div className="cal-hint">
          <span>📅</span>
          <span>Tap <strong>📅</strong> on any plant to download a recurring .ics reminder — tap the file to add it to Apple Calendar.</span>
        </div>
      )}
    </div>
  );
}

// ---- PlantSolve care data (static, CC BY 4.0, https://www.plantsolve.com/developers/) ----
const PS_BASE = "https://www.plantsolve.com/api/v1/plants/";
const PS_TTL = 7 * 86400000;
let psIndexPromise = null;

function psCacheGet(key) {
  try {
    const c = JSON.parse(localStorage.getItem(key));
    if (c && Date.now() - c.t < PS_TTL) return c.v;
  } catch {}
  return null;
}
function psCacheSet(key, v) {
  try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), v })); } catch {}
}

function loadPSIndex() {
  if (!psIndexPromise) {
    const cached = psCacheGet("plantpal_ps_index");
    psIndexPromise = cached ? Promise.resolve(cached)
      : fetch("/api/care")
          .then(r => { if (!r.ok) throw new Error("Care index unavailable (" + r.status + ")"); return r.json(); })
          .then(d => {
            const list = Array.isArray(d) ? d : (d.plants || []);
            const slim = list.map(({ slug, scientificName }) => ({ slug, scientificName }));
            psCacheSet("plantpal_ps_index", slim);
            return slim;
          });
    psIndexPromise = psIndexPromise.catch(e => { psIndexPromise = null; throw e; });
  }
  return psIndexPromise;
}

const psSlugify = (t) => (t || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const psHasCultivar = (t) => /['\u2018\u2019"]/.test(t || "");
function psBinomial(t) {
  return (t || "").toLowerCase()
    .replace(/\(.*?\)/g, " ")
    .replace(/['\u2018\u2019"].*?['\u2018\u2019"]/g, " ")
    .replace(/\u00d7/g, " ")
    .replace(/[^a-z\s-]/g, " ")
    .split(/\s+/).filter(w => w && w !== "spp" && w !== "sp" && w !== "x")
    .slice(0, 2)
    .map((w, i) => i === 0 ? ({ sansevieria: "dracaena", calathea: "goeppertia" }[w] || w) : w)
    .join(" ");
}

// All binomials named in an index entry, including synonyms such as "(formerly Calathea orbifolia)"
function psNames(t) {
  const SPLIT = /[()\/;,]|\b(?:or|syn\.?|formerly|also sold as|often sold as|commonly sold as|often confused with|recently reclassified as|reclassified as|common hybrids like)\b/i;
  return (t || "").split(SPLIT).map(psBinomial).filter(Boolean);
}

function findPSMatch(index, plant) {
  const b = psBinomial(plant.scientific_name);
  const genus = b.split(" ")[0];
  const commonSlug = psSlugify(plant.common_name);
  if (b.split(" ").length === 2) {
    const cands = index.filter(e => psNames(e.scientificName).includes(b));
    const plain = cands.filter(e => !psHasCultivar(e.scientificName));
    const pool = plain.length ? plain : cands;
    const best = pool.find(e => e.slug === psSlugify(b)) || pool.find(e => e.slug === commonSlug) || pool[0];
    if (best) return best;
  }
  const bySlug = commonSlug && index.find(e => e.slug === commonSlug);
  if (bySlug) return bySlug;
  // Genus-wide profile such as "Philodendron spp."
  if (genus) return index.find(e => /\bspp\b/i.test(e.scientificName || "") && psNames(e.scientificName).includes(genus)) || null;
  return null;
}

async function loadPSCare(plant) {
  const index = await loadPSIndex();
  const match = findPSMatch(index, plant);
  if (!match) return null;
  const key = "plantpal_ps_" + match.slug;
  let raw = psCacheGet(key);
  if (!raw) {
    const r = await fetch("/api/care?slug=" + encodeURIComponent(match.slug));
    if (!r.ok) throw new Error("Care guide unavailable (" + r.status + ")");
    raw = await r.json();
    psCacheSet(key, raw);
  }
  return { slug: match.slug, data: raw.plant || raw };
}

const psText = (v) => {
  if (typeof v === "string") return v.trim();
  if (Array.isArray(v)) return v.filter(x => typeof x === "string").join(", ");
  return "";
};
const fToC = (f) => Math.round((f - 32) * 5 / 9);

// ---- Perenual fallback (needs PERENUAL_API_KEY on the server) ----
async function loadPerenual(plant) {
  const sci = (plant.scientific_name || "").trim();
  const key = "plantpal_pn_" + psSlugify(sci || plant.common_name);
  const cached = psCacheGet(key);
  if (cached) return cached.found === false ? null : cached;
  const params = new URLSearchParams({ q: sci, common: plant.common_name || "" });
  const r = await fetch("/api/perenual?" + params.toString());
  if (r.status === 501) return null;
  if (!r.ok) throw new Error(r.status === 429 ? "The daily limit for care lookups has been reached. Try again tomorrow." : "Care lookup failed (" + r.status + ")");
  const j = await r.json();
  psCacheSet(key, j);
  return j.found === false ? null : j;
}

async function loadCare(plant) {
  let psErr = null, pnErr = null;
  try { const r = await loadPSCare(plant); if (r) return { source: "plantsolve", ...r }; } catch (e) { psErr = e; }
  try { const r = await loadPerenual(plant); if (r) return { source: "perenual", data: r }; } catch (e) { pnErr = e; }
  if (pnErr) throw pnErr;
  if (psErr) throw psErr;
  return null;
}

const psCap = (t) => (t ? t.charAt(0).toUpperCase() + t.slice(1) : "");

function CareGuide({ plant, onAddToReminders }) {
  const [state, setState] = useState({ loading: true });
  useEffect(() => {
    let live = true;
    setState({ loading: true });
    loadCare(plant)
      .then(r => live && setState({ loading: false, result: r }))
      .catch(e => live && setState({ loading: false, error: e.message }));
    return () => { live = false; };
  }, [plant.id]);

  if (state.loading) return <div aria-busy="true"><div className="skel" style={{height:14,width:"30%",marginBottom:10}} /><div className="skel" style={{height:12,marginBottom:8}} /><div className="skel" style={{height:12,width:"80%",marginBottom:16}} /><div className="skel" style={{height:14,width:"30%",marginBottom:10}} /><div className="skel" style={{height:12,width:"90%"}} /></div>;
  if (state.error) return <ErrorCard message={/daily limit/i.test(state.error) ? state.error : "We could not load the care guide. Check your connection and reopen this plant."} />;
  if (!state.result) return <div className="tip-box"><span>🌱</span><span>No care guide found for {plant.scientific_name || plant.common_name} yet. Try the Symptom Guide in the Health tab for general advice.</span></div>;

  const r = state.result;
  let sections, difficulty = "", reminderDays = 7, note = "", credit;

  if (r.source === "plantsolve") {
    const care = r.data.care || {};
    const maint = r.data.maintenance || {};
    const t = care.temperature_range || {};
    const temp = (typeof t.min_fahrenheit === "number" && typeof t.max_fahrenheit === "number")
      ? `${t.min_fahrenheit} to ${t.max_fahrenheit} °F (${fToC(t.min_fahrenheit)} to ${fToC(t.max_fahrenheit)} °C)` : "";
    sections = [
      ["💧 Watering", psText(care.water)],
      ["☀️ Light", psText(care.sunlight)],
      ["🪴 Soil", psText(care.soil_moisture_preference)],
      ["🌡️ Temperature", temp],
      ["✂️ Pruning", psText(maint.pruning)],
      ["🌱 Propagation", psText(maint.propagation)],
    ];
    difficulty = psText(care.difficulty);
    credit = <>Care data from <a href={"https://www.plantsolve.com/plants/" + r.slug + "/"} target="_blank" rel="noopener noreferrer">PlantSolve</a> (<a href="https://www.plantsolve.com" target="_blank" rel="noopener noreferrer">PlantSolve Open Dataset</a>, CC BY 4.0).</>;
  } else {
    const d = r.data;
    const nums = (d.watering_days || "").match(/\d+/g);
    if (nums) reminderDays = Math.max(1, Math.round(nums.map(Number).reduce((a, b) => a + b, 0) / nums.length));
    const water = d.watering ? psCap(d.watering) + (d.watering_days ? ". Roughly every " + d.watering_days + " days." : "") : "";
    const where = d.indoor === true ? "Can be grown indoors." : d.indoor === false ? "Best grown outdoors." : "";
    sections = [
      ["💧 Watering", water],
      ["☀️ Light", (d.sunlight || []).map(psCap).join(", ")],
      ["🔁 Life cycle", [psCap(d.cycle), where].filter(Boolean).join(". ")],
      ["✂️ Pruning", (d.pruning_month || []).length ? "Best pruned in " + d.pruning_month.join(", ") + "." : ""],
      ["🌿 Growth", psCap(d.growth_rate)],
      ["🧰 Maintenance", psCap(d.maintenance)],
      ["📝 About", d.description || ""],
    ];
    difficulty = psCap(d.care_level);
    if (!d.matched_exact) note = "Showing care data for " + (d.common_name || d.scientific_name) + ", a close relative of your plant.";
    credit = <>Plant data from <a href="https://perenual.com" target="_blank" rel="noopener noreferrer">Perenual</a>.</>;
  }

  sections = sections.filter(([, v]) => v);

  return (
    <div className="care-guide">
      {difficulty && <div className="badge badge-medium" style={{display:"inline-block",marginBottom:10}}>{r.source === "perenual" ? "Care level" : "Difficulty"}: {difficulty}</div>}
      {note && <div className="tip-box" style={{marginBottom:10}}><span>ℹ️</span><span>{note}</span></div>}
      {sections.length === 0 && <div className="tip-box"><span>📖</span><span>This profile has no structured care details yet.</span></div>}
      {sections.map(([label, value], i) => (
        <div key={label}>
          {i > 0 && <div className="advice-divider" style={{margin:"10px 0"}} />}
          <div className="advice-label">{label}</div>
          <div className="advice-text">{value}</div>
        </div>
      ))}
      <button className="btn btn-primary" style={{marginTop:14}} onClick={() => onAddToReminders({ name: plant.common_name, freq: reminderDays })}>💧 Set up watering reminder{r.source === "perenual" && reminderDays !== 7 ? " (every " + reminderDays + " days)" : ""}</button>
      <div className="sci-name" style={{fontSize:11,marginBottom:0}}>{credit} Adjust the reminder interval to match the watering tip.</div>
    </div>
  );
}

window.toast = (msg, action) => window.dispatchEvent(new CustomEvent("pp-toast", { detail: { msg, action } }));

function waterStatus(plant) {
  const next = addDays(plant.lastWatered, plant.freq);
  const diff = daysBetween(today(), next.toISOString().split("T")[0]);
  if (diff < 0) return { diff, label: `${Math.abs(diff)}d overdue`, cls: "status-urgent", urgent: true };
  if (diff === 0) return { diff, label: "Water today", cls: "status-today", urgent: true };
  return { diff, label: `In ${diff} day${diff !== 1 ? "s" : ""}`, cls: "status-ok", urgent: false };
}

function readSaved() { try { return JSON.parse(localStorage.getItem("plantpal_db") || "[]"); } catch { return []; } }
function Thumb({ photo, alt }) { return photo ? <img className="thumb" src={photo} alt={alt} /> : <div className="thumb">🌿</div>; }

function SkeletonResult({ label }) {
  return (
    <div className="result-card" aria-busy="true">
      <div className="skel-label">{label}…</div>
      <div className="skel" style={{ height: 26, width: "60%", marginBottom: 8 }} />
      <div className="skel" style={{ height: 14, width: "40%", marginBottom: 18 }} />
      <div className="skel" style={{ height: 12, marginBottom: 8 }} />
      <div className="skel" style={{ height: 12, width: "85%", marginBottom: 18 }} />
      <div className="skel" style={{ height: 48 }} />
    </div>
  );
}

function ErrorCard({ message, onRetry }) {
  return (
    <div className="error-card" role="alert">
      <span>{message}</span>
      {onRetry && <button onClick={onRetry}>Try again</button>}
    </div>
  );
}

function Home({ go }) {
  const [plants, setPlants] = useLocalStorage("plantpal_v2", []);
  const saved = readSaved();
  const photoFor = (name) => (saved.find(s => s.common_name === name) || {}).photo;
  const due = plants.map(p => ({ p, s: waterStatus(p) })).filter(x => x.s.urgent).sort((a, b) => a.s.diff - b.s.diff);
  const hour = new Date().getHours();
  const hello = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const dateStr = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  const water = (id, name) => {
    setPlants(plants.map(p => p.id === id ? { ...p, lastWatered: today() } : p));
    window.toast(`💧 Watered ${name}`);
  };

  return (
    <div className="tab-content">
      <div className="brand"><span className="brand-name">🌿 PlantPal</span><span className="eyebrow">{dateStr}</span></div>
      <h1 className="greeting">{hello}.</h1>
      <p className="tab-sub" style={{ marginBottom: 0 }}>
        {plants.length === 0 ? "Let's meet your first plant." : due.length ? `${due.length} plant${due.length > 1 ? "s need" : " needs"} water today.` : "Everything is watered. Nice work."}
      </p>

      <div className="hero">
        <h2>Identify a plant</h2>
        <p>Snap or upload a photo and get its name and care guide in seconds.</p>
        <button className="hero-btn" onClick={() => go("identify")}>📷 Scan a plant</button>
      </div>

      {plants.length > 0 && (
        <div className="stats">
          <div className="stat"><b>{plants.length}</b><span>Plants</span></div>
          <div className="stat"><b>{due.length}</b><span>Due today</span></div>
        </div>
      )}

      <div className="section-h"><h3>Today</h3>{plants.length > 0 && <button className="link-btn" onClick={() => go("reminders")}>All reminders</button>}</div>
      {plants.length === 0 ? (
        <div className="empty-state">
          <div style={{ fontSize: 44 }}>🪴</div>
          <h4>No plants yet</h4>
          <div className="empty-text">Scan a plant to identify it, then set up watering reminders.</div>
          <button className="btn btn-primary" onClick={() => go("identify")}>Scan your first plant</button>
        </div>
      ) : due.length === 0 ? (
        <div className="empty-state"><div style={{ fontSize: 40 }}>🌤️</div><h4>All caught up</h4><div className="empty-text">Nothing to water today. We will let you know when it is time.</div></div>
      ) : (
        <div className="plant-list">
          {due.map(({ p, s }) => (
            <div key={p.id} className="plant-card urgent">
              <Thumb photo={photoFor(p.name)} alt={p.name} />
              <div className="plant-info">
                <div className="plant-name">{p.name}</div>
                <span className={`status-badge ${s.cls}`}>{s.label}</span>
              </div>
              <button className="action-btn action-water" onClick={() => water(p.id, p.name)} aria-label={`Mark ${p.name} watered`}>💧</button>
            </div>
          ))}
        </div>
      )}

      <div className="section-h"><h3>Care tools</h3></div>
      <div className="quick">
        <button className="quick-btn" onClick={() => go("health")}><span style={{ fontSize: 22 }}>🩺</span><b>Diagnose a problem</b><span>Spot pests and disease</span></button>
        <button className="quick-btn" onClick={() => go("myplants")}><span style={{ fontSize: 22 }}>🌿</span><b>My collection</b><span>{saved.length} saved</span></button>
      </div>
    </div>
  );
}

function MyPlantsTab({ onAddToReminders, go }) {
  const [plants, setPlants] = useState(readSaved);
  const [reminders] = useLocalStorage("plantpal_v2", []);
  const [openId, setOpenId] = useState(null);
  const open = plants.find(p => p.id === openId);
  const statusOf = (p) => { const r = reminders.find(x => x.name === p.common_name); return r ? waterStatus(r) : null; };

  const remove = (p) => {
    const updated = plants.filter(x => x.id !== p.id);
    setPlants(updated); setOpenId(null);
    localStorage.setItem("plantpal_db", JSON.stringify(updated));
    window.toast(`Removed ${p.common_name}`, { label: "Undo", fn: () => {
      const cur = readSaved(); const back = [p, ...cur];
      localStorage.setItem("plantpal_db", JSON.stringify(back)); setPlants(back);
    } });
  };

  return (
    <div className="tab-content">
      <h2 className="tab-title">My Plants</h2>
      <p className="tab-sub">{plants.length} plant{plants.length !== 1 ? "s" : ""} in your collection.</p>
      {plants.length === 0 && (
        <div className="empty-state">
          <div style={{ fontSize: 44 }}>🌱</div>
          <h4>Your collection is empty</h4>
          <div className="empty-text">Identify a plant and tap Save to build your collection.</div>
          <button className="btn btn-primary" onClick={() => go("identify")}>Scan a plant</button>
        </div>
      )}
      <div className="db-grid">
        {plants.map(p => {
          const s = statusOf(p);
          return (
            <button key={p.id} className="db-card" onClick={() => setOpenId(p.id)}>
              {p.photo ? <img src={p.photo} className="db-card-img" alt={p.common_name} /> : <div className="db-card-img-placeholder">🌿</div>}
              <div className="db-card-body">
                <div className="db-card-name">{p.common_name}</div>
                <div className="db-card-sci">{p.scientific_name}</div>
                {s ? <span className={`status-badge ${s.cls}`}>{s.label}</span> : <span className="status-badge status-ok">No reminder</span>}
              </div>
            </button>
          );
        })}
      </div>
      {open && (
        <>
          <div className="scrim" onClick={() => setOpenId(null)} />
          <div className="sheet" role="dialog" aria-label={open.common_name}>
            <button className="sheet-close" onClick={() => setOpenId(null)} aria-label="Close">✕</button>
            {open.photo ? <img className="sheet-img" src={open.photo} alt={open.common_name} /> : <div className="sheet-img">🌿</div>}
            <div className="sheet-body">
              <div className="result-header" style={{ marginBottom: 0 }}>
                <div><div className="common-name">{open.common_name}</div><div className="sci-name">{open.scientific_name}</div></div>
                <div className={`badge badge-${(open.confidence || "low").toLowerCase()}`}>{open.confidence}</div>
              </div>
              <div className="sheet-actions">
                <button className="btn btn-primary" style={{ margin: 0 }} onClick={() => onAddToReminders({ name: open.common_name, freq: 7 })}>💧 Add reminder</button>
                <button className="btn btn-ghost" style={{ margin: 0, width: 110 }} onClick={() => remove(open)}>Remove</button>
              </div>
              <div className="eyebrow" style={{ margin: "18px 0 10px" }}>Care guide</div>
              <CareGuide plant={open} onAddToReminders={onAddToReminders} />
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("home");
  const [pending, setPending] = useState(null);
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    const h = (e) => {
      const id = Date.now() + Math.random();
      setToasts(t => [...t.slice(-1), { id, ...e.detail }]);
      setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4500);
    };
    window.addEventListener("pp-toast", h);
    return () => window.removeEventListener("pp-toast", h);
  }, []);
  const goReminder = (plant) => { setPending(plant); setTab("reminders"); };
  const TABS = [["home", "🏡", "Home"], ["myplants", "🌿", "Plants"], ["identify", "📷", "Scan"], ["health", "🩺", "Health"], ["reminders", "💧", "Water"]];
  return (
    <div className="app">
      <main key={tab} className="view">
        {tab === "home" && <Home go={setTab} />}
        {tab === "identify" && <IdentifyTab onAddPlant={goReminder} />}
        {tab === "health" && <HealthTab />}
        {tab === "reminders" && <RemindersTab pending={pending} onPendingClear={() => setPending(null)} go={setTab} />}
        {tab === "myplants" && <MyPlantsTab onAddToReminders={goReminder} go={setTab} />}
      </main>
      <div className="toasts" aria-live="polite">
        {toasts.map(t => (
          <div key={t.id} className="toast"><span>{t.msg}</span>
            {t.action && <button onClick={() => { t.action.fn(); setToasts(x => x.filter(y => y.id !== t.id)); }}>{t.action.label}</button>}
          </div>
        ))}
      </div>
      <nav className="tabbar" aria-label="Main">
        {TABS.map(([id, icon, label]) => (
          <button key={id} className={`tab-btn ${id === "identify" ? "tab-scan" : ""} ${tab === id ? "active" : ""}`} onClick={() => setTab(id)} aria-current={tab === id ? "page" : undefined}>
            {id === "identify" ? <span className="fab">{icon}</span> : <span className="ico">{icon}</span>}
            <span className="lbl">{label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

    const scriptEl = document.createElement("script");
    scriptEl.text = result.code;
    document.body.appendChild(scriptEl);
  })();
</script>
</body>
